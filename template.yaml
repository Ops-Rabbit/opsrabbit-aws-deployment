AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Deploy OpsRabbit on Amazon ECS Fargate with Amazon EFS and Amazon RDS for
  PostgreSQL. Supports a new or existing VPC and public or private access.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Deployment
        Parameters:
          - EnvironmentName
          - PublicAccessEnabled
          - ApplicationDomainName
          - CertificateArn
          - HostedZoneId
          - AllowedIngressCidr
      - Label:
          default: Network
        Parameters:
          - CreateVpc
          - VpcCidr
          - ExistingVpcId
          - ExistingLoadBalancerSubnetIds
          - ExistingApplicationSubnetIds
          - ExistingDataSubnetIds
      - Label:
          default: Container images
        Parameters:
          - ImageRepositoryAccountId
          - ImageRepositoryRegion
          - BackendImageUri
          - WebImageUri
      - Label:
          default: ECS capacity
        Parameters:
          - TaskCpu
          - TaskMemory
          - EphemeralStorageGiB
          - DesiredCount
      - Label:
          default: Database
        Parameters:
          - DatabaseEngineVersion
          - DatabaseInstanceClass
          - DatabaseAllocatedStorage
          - DatabaseBackupRetentionDays
          - DatabaseMultiAZ
          - DatabaseDeletionProtection
      - Label:
          default: Operations
        Parameters:
          - LogRetentionDays
    ParameterLabels:
      PublicAccessEnabled:
        default: Make OpsRabbit reachable from the internet
      CreateVpc:
        default: Create a dedicated VPC

Parameters:
  EnvironmentName:
    Type: String
    Default: opsrabbit
    Description: Lowercase name prefix for the deployment.
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
    ConstraintDescription: Must contain 2-20 lowercase letters, numbers, or hyphens and start with a letter.

  PublicAccessEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Use an internet-facing load balancer when true and an internal load balancer when false.

  ApplicationDomainName:
    Type: String
    Description: DNS name used by users and covered by the supplied ACM certificate.
    AllowedPattern: "^(?=.{1,253}$)(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]{2,63}$"
    ConstraintDescription: Must be a valid DNS hostname without a scheme or path.

  CertificateArn:
    Type: String
    Description: ARN of an issued ACM certificate in this stack's Region that covers ApplicationDomainName.
    AllowedPattern: "^arn:(aws|aws-us-gov|aws-cn):acm:[a-z0-9-]+:[0-9]{12}:certificate/[0-9a-f-]+$"

  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional Route 53 hosted zone ID. Leave empty when DNS is managed separately.
    AllowedPattern: "^$|^Z[A-Z0-9]+$"

  AllowedIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: IPv4 CIDR allowed to reach the HTTPS listener. Use customer network ranges for private deployments.
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$"

  CreateVpc:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Create a dedicated two-Availability-Zone VPC when true.

  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    Description: /16 CIDR for the dedicated VPC when CreateVpc is true.
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/16$"

  ExistingVpcId:
    Type: String
    Default: ""
    Description: Existing VPC ID required when CreateVpc is false.
    AllowedPattern: "^$|^vpc-(?:[0-9a-f]{8}|[0-9a-f]{17})$"

  ExistingLoadBalancerSubnetIds:
    Type: String
    Default: ""
    Description: Exactly two comma-separated existing load-balancer subnet IDs in distinct Availability Zones.
    AllowedPattern: "^$|^subnet-(?:[0-9a-f]{8}|[0-9a-f]{17}),subnet-(?:[0-9a-f]{8}|[0-9a-f]{17})$"

  ExistingApplicationSubnetIds:
    Type: String
    Default: ""
    Description: Exactly two comma-separated existing private ECS subnet IDs with outbound connectivity.
    AllowedPattern: "^$|^subnet-(?:[0-9a-f]{8}|[0-9a-f]{17}),subnet-(?:[0-9a-f]{8}|[0-9a-f]{17})$"

  ExistingDataSubnetIds:
    Type: String
    Default: ""
    Description: Exactly two comma-separated existing private RDS and EFS subnet IDs matching the application Availability Zones.
    AllowedPattern: "^$|^subnet-(?:[0-9a-f]{8}|[0-9a-f]{17}),subnet-(?:[0-9a-f]{8}|[0-9a-f]{17})$"

  ImageRepositoryAccountId:
    Type: String
    Default: "921870554228"
    Description: AWS account that owns both OpsRabbit ECR repositories.
    AllowedPattern: "^[0-9]{12}$"

  ImageRepositoryRegion:
    Type: String
    Default: us-east-1
    Description: AWS Region containing both OpsRabbit ECR repositories.
    AllowedPattern: "^[a-z]{2}(?:-gov)?-[a-z]+-[0-9]$"

  BackendImageUri:
    Type: String
    Default: 921870554228.dkr.ecr.us-east-1.amazonaws.com/opsrabbit/backend@sha256:00e6611e5f6e34bc8d8a7c21fde567db2e7f545cc5a7cc2845468ac5c3213925
    Description: Immutable full ECR URI and SHA-256 digest for the standard non-root backend image.
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com(?:\\.cn)?/[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$"

  WebImageUri:
    Type: String
    Default: 921870554228.dkr.ecr.us-east-1.amazonaws.com/opsrabbit/web@sha256:a7ae3c12b8e5a2a64cb3c14e395559c0a9b4aa0a25a1fcf4085d69c923c8f48a
    Description: Immutable full ECR URI and SHA-256 digest for the web image.
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com(?:\\.cn)?/[a-z0-9][a-z0-9._/-]*@sha256:[0-9a-f]{64}$"

  TaskCpu:
    Type: String
    Default: "2048"
    AllowedValues:
      - "2048"
      - "4096"
    Description: Fargate task CPU units. The backend and web containers share this allocation.

  TaskMemory:
    Type: String
    Default: "5120"
    AllowedValues:
      - "5120"
      - "6144"
      - "7168"
      - "8192"
    Description: Fargate task memory in MiB.

  EphemeralStorageGiB:
    Type: Number
    Default: 40
    MinValue: 21
    MaxValue: 200
    Description: Fargate ephemeral storage in GiB for images and temporary runtime files.

  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues:
      - 1
    Description: Initial release supports one OpsRabbit task.

  DatabaseEngineVersion:
    Type: String
    Default: "16"
    AllowedPattern: "^16(?:\\.[0-9]+)?$"
    Description: Amazon RDS for PostgreSQL 16 engine version.

  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.medium
    AllowedPattern: "^db\\.[a-z0-9.]+$"

  DatabaseAllocatedStorage:
    Type: Number
    Default: 50
    MinValue: 20
    MaxValue: 180
    Description: Initial gp3 database storage in GiB.

  DatabaseBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35

  DatabaseMultiAZ:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  DatabaseDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1096
      - 1827
      - 2192
      - 2557
      - 2922
      - 3288
      - 3653

Rules:
  FargateTaskSizeIsValid:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref TaskCpu, "2048"]
          - !Equals [!Ref TaskMemory, "8192"]
        AssertDescription: TaskCpu 4096 requires TaskMemory 8192 with the supported sizing choices.

  ExistingVpcInputsRequired:
    RuleCondition: !Equals [!Ref CreateVpc, "false"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingVpcId, ""]]
        AssertDescription: ExistingVpcId is required when CreateVpc is false.
      - Assert: !Not [!Equals [!Ref ExistingLoadBalancerSubnetIds, ""]]
        AssertDescription: ExistingLoadBalancerSubnetIds is required when CreateVpc is false.
      - Assert: !Not [!Equals [!Ref ExistingApplicationSubnetIds, ""]]
        AssertDescription: ExistingApplicationSubnetIds is required when CreateVpc is false.
      - Assert: !Not [!Equals [!Ref ExistingDataSubnetIds, ""]]
        AssertDescription: ExistingDataSubnetIds is required when CreateVpc is false.

Conditions:
  CreateVpcResources: !Equals [!Ref CreateVpc, "true"]
  PublicAccess: !Equals [!Ref PublicAccessEnabled, "true"]
  CreateDnsRecord: !Not [!Equals [!Ref HostedZoneId, ""]]
  EnableDatabaseMultiAZ: !Equals [!Ref DatabaseMultiAZ, "true"]
  EnableDatabaseDeletionProtection: !Equals [!Ref DatabaseDeletionProtection, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateVpcResources
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpc
        - Key: application
          Value: opsrabbit

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpcResources
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-igw
        - Key: application
          Value: opsrabbit

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVpcResources
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Condition: CreateVpcResources
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 32, 8]]
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-a
        - Key: application
          Value: opsrabbit

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Condition: CreateVpcResources
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 32, 8]]
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-b
        - Key: application
          Value: opsrabbit

  ApplicationSubnetA:
    Type: AWS::EC2::Subnet
    Condition: CreateVpcResources
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [10, !Cidr [!Ref VpcCidr, 32, 8]]
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-application-a
        - Key: application
          Value: opsrabbit

  ApplicationSubnetB:
    Type: AWS::EC2::Subnet
    Condition: CreateVpcResources
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [11, !Cidr [!Ref VpcCidr, 32, 8]]
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-application-b
        - Key: application
          Value: opsrabbit

  DataSubnetA:
    Type: AWS::EC2::Subnet
    Condition: CreateVpcResources
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [20, !Cidr [!Ref VpcCidr, 32, 8]]
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-data-a
        - Key: application
          Value: opsrabbit

  DataSubnetB:
    Type: AWS::EC2::Subnet
    Condition: CreateVpcResources
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [21, !Cidr [!Ref VpcCidr, 32, 8]]
      MapPublicIpOnLaunch: false
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-data-b
        - Key: application
          Value: opsrabbit

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpcResources
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpcResources
    DependsOn: VpcGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpcResources
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpcResources
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  NatGatewayEip:
    Type: AWS::EC2::EIP
    Condition: CreateVpcResources
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-nat

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateVpcResources
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      ConnectivityType: public
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-nat

  ApplicationRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpcResources
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-application

  ApplicationDefaultRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpcResources
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
      RouteTableId: !Ref ApplicationRouteTable

  ApplicationSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpcResources
    Properties:
      RouteTableId: !Ref ApplicationRouteTable
      SubnetId: !Ref ApplicationSubnetA

  ApplicationSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpcResources
    Properties:
      RouteTableId: !Ref ApplicationRouteTable
      SubnetId: !Ref ApplicationSubnetB

  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpcResources
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-data

  DataSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpcResources
    Properties:
      RouteTableId: !Ref DataRouteTable
      SubnetId: !Ref DataSubnetA

  DataSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpcResources
    Properties:
      RouteTableId: !Ref DataRouteTable
      SubnetId: !Ref DataSubnetB

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS access to the OpsRabbit load balancer
      VpcId: !If [CreateVpcResources, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - Description: HTTPS from the approved client network
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
        - Description: HTTP redirect to HTTPS from the approved client network
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedIngressCidr
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-load-balancer
        - Key: application
          Value: opsrabbit

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: OpsRabbit ECS task network access
      VpcId: !If [CreateVpcResources, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - Description: Web traffic only from the load balancer
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-tasks
        - Key: application
          Value: opsrabbit

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access only from OpsRabbit tasks
      VpcId: !If [CreateVpcResources, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - Description: PostgreSQL from ECS tasks
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-database
        - Key: application
          Value: opsrabbit

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS access only from OpsRabbit tasks
      VpcId: !If [CreateVpcResources, !Ref Vpc, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - Description: Encrypted NFS from ECS tasks
          IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref TaskSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-efs
        - Key: application
          Value: opsrabbit

  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BackupPolicy:
        Status: ENABLED
      Encrypted: true
      KmsKeyId: !GetAtt DataEncryptionKey.Arn
      FileSystemPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: "*"
            Action: elasticfilesystem:ClientMount
            Resource: "*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
      FileSystemTags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-data
        - Key: application
          Value: opsrabbit
      PerformanceMode: generalPurpose
      ThroughputMode: elastic

  EfsMountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SecurityGroups:
        - !Ref EfsSecurityGroup
      SubnetId: !If
        - CreateVpcResources
        - !Ref DataSubnetA
        - !Select [0, !Split [",", !Ref ExistingDataSubnetIds]]

  EfsMountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SecurityGroups:
        - !Ref EfsSecurityGroup
      SubnetId: !If
        - CreateVpcResources
        - !Ref DataSubnetB
        - !Select [1, !Split [",", !Ref ExistingDataSubnetIds]]

  ApplicationDataAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser:
        Uid: "1000"
        Gid: "1000"
      RootDirectory:
        Path: /opsrabbit-data
        CreationInfo:
          OwnerUid: "1000"
          OwnerGid: "1000"
          Permissions: "0700"
      AccessPointTags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-application-data

  GitWorkspaceAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser:
        Uid: "1000"
        Gid: "1000"
      RootDirectory:
        Path: /git-workspace
        CreationInfo:
          OwnerUid: "1000"
          OwnerGid: "1000"
          Permissions: "0700"
      AccessPointTags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-git-workspace

  AgentBrowserAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser:
        Uid: "1000"
        Gid: "1000"
      RootDirectory:
        Path: /agent-browser
        CreationInfo:
          OwnerUid: "1000"
          OwnerGid: "1000"
          Permissions: "0700"
      AccessPointTags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-agent-browser

  CodexAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser:
        Uid: "1000"
        Gid: "1000"
      RootDirectory:
        Path: /codex
        CreationInfo:
          OwnerUid: "1000"
          OwnerGid: "1000"
          Permissions: "0700"
      AccessPointTags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-codex

  DataEncryptionKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub Customer-managed encryption key for ${EnvironmentName}
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudWatchLogsEncryption
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.${AWS::URLSuffix}
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
      PendingWindowInDays: 30
      Tags:
        - Key: application
          Value: opsrabbit

  DataEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${EnvironmentName}-data
      TargetKeyId: !Ref DataEncryptionKey

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub ${EnvironmentName} RDS administrator credentials
      KmsKeyId: !Ref DataEncryptionKey
      GenerateSecretString:
        SecretStringTemplate: '{"username":"opsrabbit_admin"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - Key: application
          Value: opsrabbit

  BetterAuthSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub ${EnvironmentName} Better Auth signing secret
      KmsKeyId: !Ref DataEncryptionKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: application
          Value: opsrabbit

  EncryptionKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub ${EnvironmentName} application encryption key
      KmsKeyId: !Ref DataEncryptionKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: application
          Value: opsrabbit

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for OpsRabbit PostgreSQL
      SubnetIds: !If
        - CreateVpcResources
        - - !Ref DataSubnetA
          - !Ref DataSubnetB
        - !Split [",", !Ref ExistingDataSubnetIds]
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-database
        - Key: application
          Value: opsrabbit

  DatabaseMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole
      Tags:
        - Key: application
          Value: opsrabbit

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AllocatedStorage: !Ref DatabaseAllocatedStorage
      AllowMajorVersionUpgrade: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: !Ref DatabaseBackupRetentionDays
      CopyTagsToSnapshot: true
      DBInstanceClass: !Ref DatabaseInstanceClass
      DBName: opsrabbit_neo
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DeleteAutomatedBackups: true
      DeletionProtection: !If [EnableDatabaseDeletionProtection, true, false]
      EnableIAMDatabaseAuthentication: true
      Engine: postgres
      EngineVersion: !Ref DatabaseEngineVersion
      MasterUsername: opsrabbit_admin
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}"
      MaxAllocatedStorage: 200
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt DatabaseMonitoringRole.Arn
      MultiAZ: !If [EnableDatabaseMultiAZ, true, false]
      Port: 5432
      PubliclyAccessible: false
      StorageEncrypted: true
      KmsKeyId: !GetAtt DataEncryptionKey.Arn
      StorageType: gp3
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-postgresql
        - Key: application
          Value: opsrabbit

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      KmsKeyId: !GetAtt DataEncryptionKey.Arn
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: application
          Value: opsrabbit

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${EnvironmentName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: application
          Value: opsrabbit

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-ecs-execution-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OpsRabbitTaskExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullOpsRabbitImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !Sub arn:${AWS::Partition}:ecr:${ImageRepositoryRegion}:${ImageRepositoryAccountId}:repository/opsrabbit/backend
                  - !Sub arn:${AWS::Partition}:ecr:${ImageRepositoryRegion}:${ImageRepositoryAccountId}:repository/opsrabbit/web
              - Sid: WriteContainerLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn
              - Sid: ReadRuntimeSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseSecret
                  - !Ref BetterAuthSecret
                  - !Ref EncryptionKeySecret
              - Sid: DecryptRuntimeSecrets
                Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt DataEncryptionKey.Arn
      Tags:
        - Key: application
          Value: opsrabbit

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-ecs-task-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OpsRabbitEfsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MountApplicationFileSystem
                Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                Resource: !GetAtt FileSystem.Arn
                Condition:
                  StringEquals:
                    elasticfilesystem:AccessPointArn:
                      - !GetAtt ApplicationDataAccessPoint.Arn
                      - !GetAtt GitWorkspaceAccessPoint.Arn
                      - !GetAtt AgentBrowserAccessPoint.Arn
                      - !GetAtt CodexAccessPoint.Arn
      Tags:
        - Key: application
          Value: opsrabbit

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${EnvironmentName}-application
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      EphemeralStorage:
        SizeInGiB: !Ref EphemeralStorageGiB
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImageUri
          Essential: true
          Cpu: 1536
          MemoryReservation: 4096
          StopTimeout: 120
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: OPSRABBIT_NODE_HOST
              Value: 0.0.0.0
            - Name: OPSRABBIT_NODE_PORT
              Value: "8384"
            - Name: OPSRABBIT_NODE_DATA_DIR
              Value: /home/opsbot/.opsrabbit
            - Name: OPSRABBIT_NODE_WORKSPACE_DIR
              Value: /home/opsbot/git
            - Name: OPSRABBIT_WEB_ORIGIN
              Value: !Sub https://${ApplicationDomainName}
            - Name: OPSRABBIT_NODE_BASE_URL
              Value: !Sub https://${ApplicationDomainName}/api
            - Name: POSTGRES_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: POSTGRES_USER
              Value: opsrabbit_admin
            - Name: POSTGRES_DATABASE
              Value: opsrabbit_neo
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub "${DatabaseSecret}:password::"
            - Name: BETTER_AUTH_SECRET
              ValueFrom: !Ref BetterAuthSecret
            - Name: OPSRABBIT_NODE_ENCRYPTION_KEY
              ValueFrom: !Ref EncryptionKeySecret
          Command:
            - /bin/bash
            - -lc
            - >-
              export OPSRABBIT_NODE_DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DATABASE}?sslmode=require";
              exec node /opt/opsrabbit/apps/backend/dist/index.js
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://127.0.0.1:8384/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
            Interval: 30
            Timeout: 10
            Retries: 5
            StartPeriod: 300
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
          MountPoints:
            - SourceVolume: application-data
              ContainerPath: /home/opsbot/.opsrabbit
              ReadOnly: false
            - SourceVolume: git-workspace
              ContainerPath: /home/opsbot/git
              ReadOnly: false
            - SourceVolume: agent-browser
              ContainerPath: /home/opsbot/.agent-browser
              ReadOnly: false
            - SourceVolume: codex
              ContainerPath: /home/opsbot/.codex
              ReadOnly: false
          LinuxParameters:
            InitProcessEnabled: true

        - Name: web
          Image: !Ref WebImageUri
          Essential: true
          Cpu: 512
          MemoryReservation: 1024
          DependsOn:
            - ContainerName: backend
              Condition: HEALTHY
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
              Name: web-http
          Environment:
            - Name: VITE_API_URL
              Value: /api
            - Name: WEB_API_UPSTREAM
              Value: http://127.0.0.1:8384
            - Name: WEB_TLS_MODE
              Value: http
            - Name: WEB_SERVER_NAME
              Value: !Ref ApplicationDomainName
          EntryPoint:
            - /bin/sh
            - -c
          Command:
            - >-
              sed -i 's/listen 80;/listen 8080;/g; s/listen \[::\]:80;/listen [::]:8080;/g' /etc/nginx/templates/http.conf.template;
              exec /docker-entrypoint.sh nginx -g 'daemon off;'
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget --quiet --output-document=/dev/null http://127.0.0.1:8080/ || exit 1
            Interval: 30
            Timeout: 10
            Retries: 5
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

      Volumes:
        - Name: application-data
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref ApplicationDataAccessPoint
              IAM: ENABLED
        - Name: git-workspace
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref GitWorkspaceAccessPoint
              IAM: ENABLED
        - Name: agent-browser
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref AgentBrowserAccessPoint
              IAM: ENABLED
        - Name: codex
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref CodexAccessPoint
              IAM: ENABLED
      Tags:
        - Key: application
          Value: opsrabbit

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: !If [PublicAccess, internet-facing, internal]
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets: !If
        - CreateVpcResources
        - !If
          - PublicAccess
          - - !Ref PublicSubnetA
            - !Ref PublicSubnetB
          - - !Ref ApplicationSubnetA
            - !Ref ApplicationSubnetB
        - !Split [",", !Ref ExistingLoadBalancerSubnetIds]
      Type: application
      IpAddressType: ipv4
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: application
          Value: opsrabbit

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !If
        - PublicAccess
        - !Sub ${EnvironmentName}-public-web
        - !Sub ${EnvironmentName}-private-web
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !If [CreateVpcResources, !Ref Vpc, !Ref ExistingVpcId]
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /api/health
      HealthCheckPort: traffic-port
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "120"
      Tags:
        - Key: application
          Value: opsrabbit

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  ApplicationDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApplicationDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  EcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
      - EfsMountTargetA
      - EfsMountTargetB
    Properties:
      ServiceName: !Sub ${EnvironmentName}-service
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 900
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets: !If
            - CreateVpcResources
            - - !Ref ApplicationSubnetA
              - !Ref ApplicationSubnetB
            - !Split [",", !Ref ExistingApplicationSubnetIds]
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: application
          Value: opsrabbit

Outputs:
  OpsRabbitUrl:
    Description: Customer-facing OpsRabbit URL.
    Value: !Sub https://${ApplicationDomainName}

  AccessMode:
    Description: Public or private load-balancer access mode.
    Value: !If [PublicAccess, public, private]

  LoadBalancerDnsName:
    Description: AWS-generated load-balancer DNS name.
    Value: !GetAtt LoadBalancer.DNSName

  VpcId:
    Description: VPC containing the deployment.
    Value: !If [CreateVpcResources, !Ref Vpc, !Ref ExistingVpcId]

  EcsClusterName:
    Value: !Ref EcsCluster

  EcsServiceName:
    Value: !GetAtt EcsService.Name

  TaskExecutionRoleArn:
    Description: Role that must be allowed to pull the private OpsRabbit ECR images.
    Value: !GetAtt TaskExecutionRole.Arn

  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address

  FileSystemId:
    Value: !Ref FileSystem

  ApplicationLogGroupName:
    Value: !Ref LogGroup

  DataEncryptionKeyArn:
    Value: !GetAtt DataEncryptionKey.Arn

  DatabaseSecretArn:
    Value: !Ref DatabaseSecret

  BetterAuthSecretArn:
    Value: !Ref BetterAuthSecret

  EncryptionKeySecretArn:
    Value: !Ref EncryptionKeySecret
